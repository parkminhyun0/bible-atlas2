<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>bible-atlas2 — 3D 지형 프로토타입 v0.1</title>
<link id="mlcss" href="https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --ink: #2b2a26;
    --ink-soft: #6a655b;
    --panel: rgba(250, 248, 243, 0.92);
    --line: #d9d3c6;
    --accent: #4f6d8f;
  }
  html, body { margin: 0; height: 100%; height: 100dvh; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: var(--ink); }
  /* 우주에서 시작해 지표로 내려오면 낮 하늘로 바뀐다 (updateBackdrop). */
  body { background: #04060d; }
  #map { position: absolute; inset: 0; }
  /* 해가 진 뒤 화면 전체를 눌러 어둡게 한다. 지도 위, 패널 아래. */
  #night { position: absolute; inset: 0; pointer-events: none;
           background: #040814; opacity: 0; transition: opacity .35s linear; }
  /* 지구 밖에서는 MapLibre 캔버스가 투명하므로 그 뒤에 우주를 직접 그린다. */
  /* canvas 는 대체 요소라 inset: 0 만으로는 늘어나지 않는다. 크기를 명시해야 한다. */
  #space { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }

  .panel {
    /* content-box 면 max-height 가 패딩·테두리를 빼고 계산돼 실제 높이가 넘친다.
       width 280px = 기존 내용폭 250 + 패딩 28 + 테두리 2 로 겉보기 크기는 그대로다. */
    box-sizing: border-box;
    position: absolute; top: 14px; left: 14px; width: 280px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    font-size: 13px; line-height: 1.45;
    /* 방위 기준 항목이 들어가며 길어졌다. 낮은 화면에서 범례가 잘리지 않게 한다. */
    max-height: calc(100% - 28px); overflow-y: auto; overscroll-behavior: contain;
  }
  .panel h1 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .panel .sub { color: var(--ink-soft); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; }
  .row output { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0 0 8px; }
  input[type=checkbox] { accent-color: var(--accent); }
  button { font: inherit; font-size: 12px; padding: 5px 9px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .aspect { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .aspect-h { font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns button { width: 100%; }
  .btns button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btns button:disabled { color: var(--ink-soft); opacity: .5; cursor: default; border-style: dashed; }
  .btns button:disabled:hover { border-color: var(--line); }
  .aspect-note { font-size: 11px; line-height: 1.55; color: var(--ink-soft); margin-top: 8px; min-height: 4.6em; }
  .aspect-note b { color: var(--ink); font-weight: 600; }
  .aspect-note bdi { font-size: 12.5px; }

  .legend { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .ramp { height: 10px; border-radius: 3px; border: 1px solid var(--line); }
  .ramp-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .swatches { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--ink-soft); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(0,0,0,.15); }

  .readout {
    position: absolute; left: 14px; bottom: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }
  .readout b { color: var(--ink); font-weight: 600; }

  .status {
    position: absolute; top: 14px; right: 60px; background: #fff3c4; border: 1px solid #e3cf7a;
    border-radius: 6px; padding: 6px 10px; font-size: 12px; display: none;
  }
  /* 데스크톱: 패널을 왼쪽 화면 밖으로 밀어 넣는다. */
  .panel { transition: transform .25s ease; }
  body.panel-hidden .panel { transform: translateX(calc(-100% - 18px)); }

  /* 숨김/열기 손잡이. 패널과 함께 움직이지 않도록 화면에 고정한다. */
  #panelHide {
    position: absolute; top: 14px; left: 302px; z-index: 3;
    width: 26px; height: 46px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; color: var(--ink-soft);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 0 6px 6px 0; border-left-color: transparent;
    box-shadow: 1px 1px 4px rgba(0,0,0,.08);
    transition: left .25s ease;
  }
  body.panel-hidden #panelHide { left: 0; border-radius: 0 6px 6px 0; border-left-color: var(--line); }
  #panelHide:hover { color: var(--accent); }

  /* 모바일에서는 바텀시트라 이 손잡이가 필요 없다. */
  #panelToggle, #panelClose { display: none; }

  /* 좁거나 낮은 화면 = 바텀시트.
     기존에는 폭만 100% 로 늘리고 높이는 그대로여서 화면의 89% 가 패널에 가렸다. */
  @media (max-width: 760px), (max-height: 500px) {
    .panel {
      top: auto; bottom: 0; left: 0; width: 100%;
      max-height: 58dvh;
      border-radius: 14px 14px 0 0;
      border-left: 0; border-right: 0; border-bottom: 0;
      padding: 14px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 14px rgba(0,0,0,.20);
      transform: translateY(101%);
      transition: transform .24s ease;
      -webkit-overflow-scrolling: touch;
    }
    .panel.open { transform: translateY(0); }

    #panelHide { display: none; }
    #panelToggle {
      display: block; position: absolute;
      top: calc(12px + env(safe-area-inset-top)); left: 12px;
      padding: 9px 14px; font-size: 13px; font-weight: 600;
      border-radius: 999px; background: var(--panel);
      border: 1px solid var(--line); box-shadow: 0 1px 5px rgba(0,0,0,.16);
    }
    #panelClose {
      display: block; position: absolute; top: 8px; right: 10px;
      width: 34px; height: 34px; padding: 0; font-size: 16px; line-height: 1;
      border-radius: 999px; border-color: transparent; background: transparent;
      color: var(--ink-soft);
    }
    .panel h1 { padding-right: 40px; }

    /* 손가락으로 누를 수 있는 크기로 키운다. */
    .panel button { min-height: 40px; font-size: 13px; }
    .row { margin: 10px 0; }
    input[type=checkbox] { width: 18px; height: 18px; }
    input[type=range] { height: 28px; }
    .btns { gap: 8px; }
    .swatches { flex-wrap: wrap; row-gap: 4px; }

    /* 트랙패드 두 손가락 제스처는 터치 기기에 해당 없다. */
    .desktop-only { display: none; }

    /* 시트가 열리면 고도 표시는 가려지므로 숨긴다. */
    body.sheet-open .readout { display: none; }
    .readout { bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; max-width: 62vw; }
    .status { right: 12px; top: calc(58px + env(safe-area-inset-top)); max-width: calc(100% - 24px); }
  }
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div id="map"></div>
<div id="night" aria-hidden="true"></div>

<button id="panelToggle" aria-expanded="false" aria-controls="panel">☰ 지도 설정</button>
<button id="panelHide" aria-expanded="true" aria-controls="panel" aria-label="설정 패널 숨기기" title="설정 패널 숨기기">◀</button>

<div class="panel" id="panel" role="region" aria-label="지형 표시 설정">
  <button id="panelClose" aria-label="설정 닫기">✕</button>
  <h1>bible-atlas2 · 3D 지형</h1>
  <div class="sub">고대근동 · 이집트 · 가나안 · 바울 선교지 · 구형(globe)</div>

  <div class="row"><label for="exag">지형 과장 배율</label><output id="exagOut">1.6×</output></div>
  <input id="exag" type="range" min="1" max="4" step="0.1" value="1.6" />

  <div class="row"><label for="snow">설선 (텍스처 없는 곳의 고도색)</label><output id="snowOut">2,500 m</output></div>
  <input id="snow" type="range" min="1500" max="4500" step="50" value="2500" />

  <div class="row"><label><input type="checkbox" id="baked" checked /> 구운 지표 텍스처 (WorldCover)</label></div>
  <div class="row"><label><input type="checkbox" id="forest" checked /> 실제 지표 피복 (산림·경작지·사막)</label></div>
  <div class="row"><label><input type="checkbox" id="shade" checked /> 음영기복 (hillshade)</label></div>
  <div class="row"><label><input type="checkbox" id="borders" checked /> 국경선 (일반 지도 형식)</label></div>
  <div class="row desktop-only"><label><input type="checkbox" id="gesture" checked /> 두 손가락 드래그 = 회전·기울기</label></div>
  <div class="sub desktop-only" style="margin:2px 0 4px">좌우 = 회전, 상하 = 기울기 · 핀치 = 확대/축소 · 한 손가락 드래그 = 이동</div>
  <div class="row" style="margin-top:8px">
    <button id="viewLevant">가나안</button>
    <button id="viewAnatolia">소아시아</button>
    <button id="viewAll">전체</button>
    <button id="viewGlobe">지구</button>
  </div>

  <div class="aspect">
    <div class="aspect-h">지명</div>
    <div class="btns" role="group" aria-label="지명 표시">
      <button id="ntPlaces" aria-pressed="false">신약 지명</button>
      <button id="otPlaces" aria-pressed="false">구약 지명</button>
    </div>
    <div class="row" style="margin-top:8px"><label><input type="checkbox" id="occlude" checked /> 산에 가린 지명 숨기기</label></div>
    <div class="sub" id="placeNote" style="margin-top:7px"></div>
  </div>

  <div class="aspect">
    <div class="aspect-h">태양 · 시간대</div>
    <div class="row"><label><input type="checkbox" id="sunOn" checked /> 태양 위치로 그림자 만들기</label></div>
    <div class="row"><label for="sunHour">시각 (현지 태양시)</label><output id="sunOut">14:00</output></div>
    <input id="sunHour" type="range" min="0" max="24" step="0.25" value="14" />
    <div class="sub" id="sunNote" style="margin-top:2px"></div>
  </div>

  <div class="aspect">
    <div class="aspect-h">방위 기준 — ‘위쪽’은 자연법칙이 아니라 약속이다</div>
    <div class="btns" role="group" aria-label="방위 기준 선택">
      <button id="aspN" data-aspect="N" aria-pressed="false">북쪽 위</button>
      <button id="aspE" data-aspect="E" aria-pressed="false">동쪽 위</button>
      <button id="aspTilt" data-aspect="TILT" aria-pressed="false">기울기</button>
      <button id="aspS" data-aspect="S" aria-pressed="false">남쪽 위</button>
    </div>
    <div class="aspect-note" id="aspNote"></div>
  </div>

  <div class="legend">
    <div class="ramp" id="rampBar"></div>
    <div class="ramp-labels"><span>−430 m</span><span>1,000</span><span>2,000</span><span id="snowLabel">2,500+</span></div>
    <div class="swatches">
      <span><i class="sw" style="background:#4d7d3f"></i>산림</span>
      <span><i class="sw" style="background:#f4f7fa"></i>눈·빙하</span>
      <span><i class="sw" style="background:#7fb5dc"></i>호수</span>
      <span><i class="sw" style="background:linear-gradient(90deg,#c4e2ef,#0f2a4d)"></i>바다 (얕음→깊음)</span>
    </div>
  </div>
</div>

<div class="readout" id="readout">마우스를 지도 위에 올리면 고도를 표시합니다</div>
<div class="status" id="status"></div>

<script type="module">
// ---------- 우주 배경 ----------
// 지구 밖은 MapLibre 캔버스가 투명하다. 그 뒤에 별을 직접 그려 넣는다.
// 지표로 내려올수록 걷어내야 한다. 낮 하늘 위에 별이 남으면 오히려 비현실적이다.
const space = document.getElementById('space');
const sctx = space.getContext('2d');

const SKY_SEED = 20260905;
let seed = SKY_SEED;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

function drawSpace() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = space.clientWidth, h = space.clientHeight;
  if (!w || !h) return;
  space.width = Math.round(w * dpr);
  space.height = Math.round(h * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  sctx.clearRect(0, 0, w, h);   // 배경색은 body 가 맡는다. 여기서는 별만 그린다.

  seed = SKY_SEED;                       // 창 크기를 바꿔도 같은 하늘이 나오게 고정한다
  const count = Math.round(w * h / 1300);
  for (let i = 0; i < count; i++) {
    const x = rnd() * w, y = rnd() * h;
    const mag = rnd();                   // 실제 하늘처럼 대부분 어둡고 소수만 밝다
    const r = 0.25 + mag * mag * mag * 1.6;
    const a = 0.16 + mag * mag * 0.82;
    const tint = rnd();
    sctx.fillStyle = tint < 0.72 ? `rgba(255,255,255,${a})`
                   : tint < 0.88 ? `rgba(188,212,255,${a})`
                                 : `rgba(255,224,194,${a})`;
    sctx.beginPath();
    sctx.arc(x, y, r, 0, 6.2832);
    sctx.fill();

    if (mag > 0.993) {                   // 가장 밝은 몇 개에만 아주 옅은 광채를 준다
      const halo = sctx.createRadialGradient(x, y, 0, x, y, r * 4);
      halo.addColorStop(0, 'rgba(255,255,255,0.16)');
      halo.addColorStop(1, 'rgba(255,255,255,0)');
      sctx.fillStyle = halo;
      sctx.beginPath();
      sctx.arc(x, y, r * 4, 0, 6.2832);
      sctx.fill();
    }
  }
}

const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;

// 별은 대기권으로 들어서기 전에 먼저 사라진다.
const starOpacity = zoom => clamp01((5.5 - zoom) / 2);

// 배경은 우주의 검정에서 낮 하늘로 '색을 보간'한다.
// 반투명 크로스페이드로 검정을 걷어내면 중간 줌에서 회색 스모그처럼 보인다.
// 검정에서 옅은 하늘색으로 곧장 이으면 그 직선이 회색을 지나므로,
// 고고도의 짙은 파랑을 경유하게 해서 고도를 낮추는 느낌을 낸다.
// 지표 부근의 배경색. 태양이 정하는 하늘색을 그대로 따라간다(applySun 에서 갱신).
// 예전에는 옅은 회백색으로 고정돼 있었다. 하늘이 그려지지 않는 각도에서 그 색이
// 화면을 채워 '하얗게 변하는' 것처럼 보였고, 밤에도 밝은 채로 남았다.
let groundSkyRGB = [176, 205, 228];    // 지평선 쪽
let groundZenithRGB = [64, 122, 190];  // 천정 쪽

const BACKDROP = [
  [5.8, [  4,   6,  13]],   // 우주
  [7.0, [ 26,  52,  92]],   // 고고도 짙은 하늘
  [8.6, [139, 176, 214]]    // 상층 하늘
];
function backdropColor(zoom) {
  const stops = BACKDROP.concat([[10.0, groundSkyRGB]]);
  if (zoom <= stops[0][0]) return `rgb(${stops[0][1]})`;
  for (let i = 1; i < stops.length; i++) {
    const [z0, c0] = stops[i - 1], [z1, c1] = stops[i];
    if (zoom <= z1) {
      const t = (zoom - z0) / (z1 - z0);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * t)).join(',')})`;
    }
  }
  return `rgb(${groundSkyRGB})`;
}

drawSpace();
let resizeTimer = null;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawSpace, 150);
});

// ---------- 라이브러리 로드 (MapLibre v6는 ESM 전용: .mjs만 배포됨) ----------
const CDNS = [
  'https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.mjs',
  'https://cdn.jsdelivr.net/npm/maplibre-gl@6/dist/maplibre-gl.mjs'
];
let maplibregl = null;
for (const url of CDNS) {
  try { maplibregl = await import(url); break; } catch (e) { console.warn('CDN 실패:', url, e); }
}
if (!maplibregl) {
  const s = document.getElementById('status');
  s.style.display = 'block';
  s.textContent = 'MapLibre 모듈을 불러오지 못했습니다. 인터넷 연결 또는 CDN 차단 여부를 확인하세요.';
} else {
  initMap();
}

function initMap() {
const TOUCH = matchMedia('(pointer: coarse)').matches;

// ---------- 데이터 소스 ----------
// 육지 DEM: Mapterhorn (Terrarium 인코딩, 512px WebP, 무료·키 불필요, 바다는 0m로 고정)
//   → 지형 3D는 이걸로만 세운다. 해저 깊이가 지형에 섞이면 해안선이 절벽처럼 꺼져 '깨짐'이 생긴다.
const LAND_DEM  = 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp';
// 해저 DEM: AWS Terrain Tiles (Terrarium, ETOPO1 해저지형 포함) → 바다 깊이 색상 전용
const BATHY_DEM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
// 벡터(물·산림·빙하·국경): OpenFreeMap (OpenMapTiles 스키마, 키 불필요)
const VECTOR_URL = 'https://tiles.openfreemap.org/planet';
// 구운 텍스처 타일 (bake/README.md 참고). 아직 굽지 않았으면 이 레이어는 비어 있고 아래 고도색이 대신 보인다.
// new URL(...)은 {z}/{x}/{y} 중괄호를 퍼센트 인코딩해 MapLibre가 좌표를 치환하지 못한다.
// hash: true 라서 주소에 #4.6/33.5/36.5 가 붙으므로 쿼리·해시를 떼고 디렉터리만 남긴다.
const SITE_ROOT = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
const BAKED_TILES = SITE_ROOT + 'tiles/{z}/{x}/{y}.webp';
const WORLD_TILES = SITE_ROOT + 'world/{z}/{x}/{y}.webp';
const NT_PLACES = SITE_ROOT + 'data/nt-places.geojson';
const OT_PLACES = SITE_ROOT + 'data/ot-places.geojson';

// ---------- 육지 고도 색상 (설선 가변) ----------
// 정확히 0m(=바다로 고정된 값)만 투명하게 두어 아래의 해저 색이 비치게 한다. 사해·요단 계곡(음수)은 육지색 유지.
function reliefRamp(snowLine) {
  const s = snowLine;
  // 암석대 시작. 401 하한은 저지대 스톱(0m 투명 처리 포함)이 항상 살아남게 한다.
  const rock = Math.max(401, Math.min(2350, s - 250));
  // 저지대 색은 설선과 무관하게 고정한다. 설선이 내려오면 암석대에 먹히는 스톱만 덜어낸다.
  // interpolate 는 입력값이 강한 오름차순이어야 하므로 이 filter 가 불변식을 강제한다.
  const base = [
    [-450, '#c9d3a8'],  // 사해 주변 저지
    // 예전에는 0m 를 투명하게 두어 아래 바다색이 비치게 했다. 그런데 DEM 은
    // '바다 0m' 와 '나일 삼각주 육지 0m'(실측 -0.2~+0.5m)를 구분하지 못해
    // 삼각주가 통째로 바다처럼 칠해졌다. 고도색은 어디서나 불투명하게 두고,
    // 바다는 OSM 해안선 폴리곤(sea)으로 그린다.
    [    0, '#cfd6a6'],
    [ 150, '#d8d6a0'],
    [ 400, '#dac68f'],
    [ 800, '#c6a87a'],  // 채도를 낮춰 사막 주황이 아나톨리아 고원까지 번지지 않게 한다
    [1300, '#ab9070'],
    [1900, '#948069']
  ].filter(([elev]) => elev < rock);

  return ['interpolate', ['linear'], ['elevation'],
    ...base.flat(),
    rock,    '#8b8375',                  // 암석 회갈색
    s - 120, '#a9a59c',
    s,       '#e9edf0',                  // 설선
    s + 500, '#ffffff'
  ];
}
// ---------- 해저 깊이 색상 (지중해 최대 약 5,100m, 홍해 약 2,500m) ----------

  -6000, '#0f2a4d',
  -4000, '#173b69',
  -2500, '#1e4f86',
  -1200, '#2a6aa5',
   -500, '#3f88be',
   -150, '#6fb1d9',
    -30, '#a4d1e7',
     -8, 'rgba(0,0,0,0)'   // 얕은 연안·육지는 건드리지 않는다
];

// 하늘. 지표에서도 대기를 그려야 지평선 위가 '빈 배경'이 아니라 실제 하늘이 된다.
// 예전에는 z7 에서 atmosphere-blend 를 0 으로 떨어뜨려, 확대하면 하늘이 사라지고
// body 배경색이 그대로 비쳤다.
const BASE_SKY = {
  'sky-color': '#4d8fd6', 'horizon-color': '#cfe0ee', 'fog-color': '#cfe0ee',
  'sky-horizon-blend': 0.7,
  // fog-ground-blend 는 안개가 시작하는 지점이다. 0 은 화면 중앙, 1 은 지평선.
  // 1 로 밀어 지형은 끝까지 선명하게 두고 지평선 끝에서만 하늘과 만나게 한다.
  'fog-ground-blend': 1,
  'horizon-fog-blend': 1,
  // 지표에서는 완전히 끈다. 대기 산란이 지평선 거리에 해당하는 화면 높이에
  // 뚜렷한 가로 경계선을 만들고(측정: 경계 강도 18.5 → 0 으로 두면 6.1),
  // 가까운 땅을 하얗게 덮는다. 구형 뷰의 후광에는 필요하므로 저줌에만 남긴다.
  // 지표의 하늘은 body 배경 그라데이션이 대신한다(syncSpace).
  'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 4, 0.5, 6, 0.25, 8, 0]
};

// 지도 관습대로 북서쪽에서 빛을 주는 설정. 태양 시뮬레이션을 끄면 여기로 돌아온다.

  alt: [42, 64, 72, 68],
  hi: ['rgba(255,243,220,0.30)', 'rgba(255,250,240,0.20)',

  sh: ['rgba(46,56,78,0.72)', 'rgba(60,70,92,0.48)',

// 지명 라벨의 노출 구간. 넓게 볼 때 84개가 한꺼번에 나오면 읽을 수 없다.
// rank 1 은 늘, 2 는 z6 부터, 3 은 z8 부터 서서히 나타난다.
// MapLibre 는 한 표현식 안에 줌 기반 보간을 하나만 허용한다. 그래서 줌 보간을
// 바깥에 두고, 각 구간의 값에서 rank 로 갈라 준다.
// 지형에 가린 지명은 feature-state 로 감춘다(updateOcclusion).
const PLACE_VISIBLE = ['case', ['boolean', ['feature-state', 'hidden'], false], 0, 1];
const PLACE_OPACITY = ['interpolate', ['linear'], ['zoom'],
  5.5, ['*', PLACE_VISIBLE, ['case', ['<=', ['get', 'rank'], 1], 1, 0]],
  6.5, ['*', PLACE_VISIBLE, ['case', ['<=', ['get', 'rank'], 2], 1, 0]],
  7.5, ['*', PLACE_VISIBLE, ['case', ['<=', ['get', 'rank'], 3], 1, 0]],
  8.5, ['*', PLACE_VISIBLE, ['case', ['<=', ['get', 'rank'], 4], 1, 0]],
  9.5, PLACE_VISIBLE
];

// ---------- 트랙패드 두 손가락 드래그 → 회전(좌우)·기울기(상하) ----------
// 브라우저는 두 손가락 드래그를 wheel 이벤트(deltaX/deltaY)로 전달한다.
// 핀치(맥 트랙패드)는 ctrlKey=true 로 오므로 그대로 MapLibre 확대/축소에 넘긴다.
let gestureOn = true, accX = 0, accY = 0, raf = null;
function applyGesture() {
  raf = null;
  if (!accX && !accY) return;
  map.setBearing(map.getBearing() + accX * 0.25);
  map.setPitch(Math.max(0, Math.min(map.getMaxPitch(), map.getPitch() - accY * 0.2)));
  accX = accY = 0;
}
map.getCanvasContainer().addEventListener('wheel', ev => {
  if (!gestureOn || ev.ctrlKey || ev.metaKey) return;   // 핀치 줌은 통과
  ev.preventDefault(); ev.stopImmediatePropagation();
  const k = ev.deltaMode === 1 ? 16 : 1;                 // line 단위(마우스 휠) 보정
  accX += ev.deltaX * k; accY += ev.deltaY * k;
  if (!raf) raf = requestAnimationFrame(applyGesture);
}, { capture: true, passive: false });

// 어두운 지형 위에서도 형태가 보이도록 흰 테두리를 두르고, 봉우리에 눈을 얹는다.
function makePeakIcon(px) {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const g = c.getContext('2d');
  const cx = px / 2, top = px * 0.14, base = px * 0.86, half = px * 0.42;
  const tri = () => {
    g.beginPath();
    g.moveTo(cx, top);
    g.lineTo(cx + half, base);
    g.lineTo(cx - half, base);
    g.closePath();
  };
  tri(); g.lineJoin = 'round'; g.lineWidth = px * 0.17; g.strokeStyle = '#ffffff'; g.stroke();
  tri(); g.fillStyle = '#6f5c49'; g.fill();
  g.save(); tri(); g.clip();
  const capY = top + (base - top) * 0.40;
  g.beginPath();
  g.moveTo(cx, top);
  g.lineTo(cx + half * 0.44, capY);
  g.lineTo(cx + half * 0.20, capY - px * 0.05);
  g.lineTo(cx - half * 0.16, capY);
  g.lineTo(cx - half * 0.44, capY);
  g.closePath();
  g.fillStyle = '#f6f8fa'; g.fill(); g.restore();
  return { width: px, height: px, data: new Uint8Array(g.getImageData(0, 0, px, px).data.buffer) };
}

// ---------- 지형 가림 ----------
// MapLibre 는 구형 투영의 지평선 뒤만 가리고 지형 가림은 하지 않는다. 직접 판정한다.
// 카메라에서 지명까지 시선을 그어, 중간 지형이 그 선을 넘으면 가려진 것으로 본다.
const FOV = 0.6435011087932844;          // MapLibre 기본 화각
function cameraPos() {
  const c = map.getCenter(), z = map.getZoom();
  const pitch = map.getPitch() * D2R, bearing = map.getBearing() * D2R;
  const h = map.getCanvas().clientHeight / (window.devicePixelRatio || 1);
  const mPerPx = 40075016.686 * Math.cos(c.lat * D2R) / (512 * Math.pow(2, z));
  const dist = (0.5 * h / Math.tan(FOV / 2)) * mPerPx;     // 카메라~중심 거리(m)
  const back = dist * Math.sin(pitch);                     // 중심에서 뒤로 물러난 수평거리
  return {
    lng: c.lng - back * Math.sin(bearing) / (111320 * Math.cos(c.lat * D2R)),
    lat: c.lat - back * Math.cos(bearing) / 111320,
    alt: (map.getCameraTargetElevation() || 0) + dist * Math.cos(pitch)
  };
}
function losBlocked(cam, lng, lat) {
  const target = map.queryTerrainElevation({ lng, lat }, { exaggerated: true });
  if (target == null) return false;
  for (let i = 1; i < 16; i++) {
    const f = i / 16;
    const g = map.queryTerrainElevation(
      { lng: cam.lng + (lng - cam.lng) * f, lat: cam.lat + (lat - cam.lat) * f },
      { exaggerated: true });
    // 25m 여유 — DEM 잡음 때문에 제 위치가 스스로를 가리는 것을 막는다
    if (g != null && g > cam.alt + (target - cam.alt) * f + 25) return true;
  }
  return false;
}

const placeCache = {};
for (const [srcId, url] of [['ntplaces', NT_PLACES], ['otplaces', OT_PLACES]]) {
  fetch(url).then(r => r.json()).then(g => {
    placeCache[srcId] = g.features.map(f => ({
      id: f.id, lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], hidden: false
    }));
    updateOcclusion();
  }).catch(() => {});
}

function updateOcclusion() {
  if (!styleReady) return;
  // 눕혀서 가까이 볼 때만 의미가 있다. 위에서 내려다보면 가릴 지형이 없다.
  const active = $('occlude').checked && map.getPitch() >= 30 && map.getZoom() >= 7;
  const cam = active ? cameraPos() : null;
  // getBounds() 는 크게 눕히면 먼 시야를 담지 못한다. 화면 투영으로 판정한다.
  const cv = map.getCanvas();
  const W = cv.clientWidth, H = cv.clientHeight;
  const onScreen = (lng, lat) => {
    const q = map.project([lng, lat]);
    return q.x > -120 && q.x < W + 120 && q.y > -120 && q.y < H + 120;
  };
  for (const [srcId, list] of Object.entries(placeCache)) {
    if (!list) continue;
    for (const f of list) {
      const hide = active && onScreen(f.lng, f.lat) && losBlocked(cam, f.lng, f.lat);
      if (hide !== f.hidden) {
        f.hidden = hide;
        map.setFeatureState({ source: srcId, id: f.id }, { hidden: hide });
      }
    }
  }
}
map.on('moveend', updateOcclusion);

// ---------- 태양 위치 ----------
// 저정밀 태양 위치(USNO 공식). 검증: 예루살렘(31.78N) 하지 정오 81.6°, 동지 34.8°,
// 춘분 58.1° — 천문값과 일치한다.
const D2R = Math.PI / 180;
function sunPosition(utcMillis, lat, lon) {
  const d = (utcMillis - Date.UTC(2000, 0, 1, 12)) / 86400000;
  const g = D2R * (357.528 + 0.9856003 * d);
  const L = D2R * (280.460 + 0.9856474 * d);
  const lam = L + D2R * (1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
  const eps = D2R * (23.439 - 0.0000004 * d);
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  const lmst = (gmst + lon / 15 + 24) % 24;
  let H = lmst * 15 * D2R - ra;
  H = Math.atan2(Math.sin(H), Math.cos(H));          // -π..π 로 접는다
  const phi = lat * D2R;
  const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  let cosAz = (Math.sin(dec) - Math.sin(phi) * sinAlt) / (Math.cos(phi) * Math.cos(alt));
  let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) / D2R;
  if (Math.sin(H) > 0) az = 360 - az;               // 정오 이후에는 서쪽
  return { altitude: alt / D2R, azimuth: az };
}

// 슬라이더는 '그 지점의 태양시'다. 경도로 UTC 를 되돌린다.
function localSolarToUTC(hour, lon) {
  const base = new Date();
  base.setUTCHours(0, 0, 0, 0);
  return base.getTime() + (hour - lon / 15) * 3600000;
}

const mixRGB = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgbStr = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgbaStr = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;

// 태양 고도에 따른 하늘색 (천정, 지평선)
const SKY_STOPS = [
  [-14, [  6,   9,  20], [ 14,  20,  38]],   // 밤
  [ -4, [ 22,  34,  64], [ 74,  62,  96]],   // 박명
  [  3, [ 70, 110, 166], [236, 158,  96]],   // 일출·일몰
  [ 12, [ 62, 118, 182], [178, 206, 228]],   // 아침·저녁
  [ 45, [ 42, 100, 184], [166, 198, 224]]    // 한낮
];
function skyByAltitude(alt) {
  if (alt <= SKY_STOPS[0][0]) return { zenith: SKY_STOPS[0][1], horizon: SKY_STOPS[0][2] };
  for (let i = 1; i < SKY_STOPS.length; i++) {
    const [a0, z0, h0] = SKY_STOPS[i - 1];
    const [a1, z1, h1] = SKY_STOPS[i];
    if (alt <= a1) {
      const t = (alt - a0) / (a1 - a0);
      return { zenith: mixRGB(z0, z1, t), horizon: mixRGB(h0, h1, t) };
    }
  }
  const last = SKY_STOPS[SKY_STOPS.length - 1];
  return { zenith: last[1], horizon: last[2] };
}

const COMPASS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];

function applySun() {
  if (!styleReady) return;
  try { applySunNow(); } catch (e) {
    // 스타일이 아직 준비되지 않았다면 조용히 넘긴다. 다음 이벤트에서 다시 시도한다.

function applySunNow() {
  const hs = (k, v) => map.setPaintProperty('hillshade', k, v);

  if (!$('sunOn').checked) {
    hs('hillshade-illumination-direction', ['literal', CARTO_LIGHT.dir]);
    hs('hillshade-illumination-altitude', ['literal', CARTO_LIGHT.alt]);
    hs('hillshade-highlight-color', ['literal', CARTO_LIGHT.hi]);
    hs('hillshade-shadow-color', ['literal', CARTO_LIGHT.sh]);
    hs('hillshade-exaggeration', CARTO_LIGHT.exag);
    map.setSky(BASE_SKY);
    groundSkyRGB = [207, 224, 238];   // BASE_SKY 의 horizon-color
    groundZenithRGB = [77, 143, 214];  // BASE_SKY 의 sky-color
    syncSpace();
    $('night').style.opacity = 0;
    $('sunNote').textContent = '지도 관습대로 북서쪽에서 빛을 준다 — 시간과 무관하다.';
    return;
  }

  const c = map.getCenter();
  const s = sunPosition(localSolarToUTC(sunHour, c.lng), c.lat, c.lng);
  const alt = s.altitude, az = s.azimuth;
  const day = clamp01((alt + 6) / 14);        // -6°~8° 에 걸쳐 밤 → 낮
  const warm = clamp01(1 - alt / 28);         // 해가 낮을수록 붉다

  // 주광은 태양, 나머지 셋은 하늘빛을 흉내낸 약한 보조광이다.
  // 보조광이 없으면 그늘이 새까맣게 죽어 지형이 읽히지 않는다.
  // 보조광은 태양 반대편까지 고르게 벌린다. 예전에는 +150/+210/+180 을 써서
  // 셋이 60° 안에 뭉쳤고, 그쪽을 향한 사면만 하이라이트가 겹쳐 들떴다.
  hs('hillshade-illumination-direction',
     ['literal', [az, (az + 90) % 360, (az + 180) % 360, (az + 270) % 360]]);
  hs('hillshade-illumination-altitude', ['literal', [Math.max(alt, 1.5), 58, 58, 72]]);
  hs('hillshade-highlight-color', ['literal', [
    rgbaStr(mixRGB([255, 250, 240], [255, 190, 120], warm), 0.40 * day),
    'rgba(255,255,255,0.10)', 'rgba(255,255,255,0.10)', 'rgba(255,255,255,0.08)']]);
  hs('hillshade-shadow-color', ['literal', [
    rgbaStr(mixRGB([38, 48, 72], [62, 42, 58], warm), 0.30 + 0.55 * day),
    'rgba(60,70,92,0.22)', 'rgba(72,80,98,0.18)', 'rgba(78,86,104,0.18)']]);
  // 해가 낮을수록 그림자가 길어진다 — 과장을 올려 그 느낌을 낸다.
  hs('hillshade-exaggeration', 0.5 + 0.30 * (1 - clamp01(alt / 60)));

  const sky = skyByAltitude(alt);
  groundSkyRGB = sky.horizon;     // 지표 배경(하늘)을 태양에 맞춘다
  groundZenithRGB = sky.zenith;
  syncSpace();
  map.setSky(Object.assign({}, BASE_SKY, {
    'sky-color': rgbStr(sky.zenith),
    'horizon-color': rgbStr(sky.horizon),
    'fog-color': rgbStr(sky.horizon)
  }));

  // 밤에는 화면 전체를 눌러 어둡게. 구형 뷰까지 어두워지지 않도록 줌으로 가중한다.
  const nightAmt = clamp01((-alt - 1) / 10) * 0.55;
  $('night').style.opacity = (nightAmt * clamp01((map.getZoom() - 5) / 2)).toFixed(3);

  const hh = Math.floor(sunHour), mm = Math.round((sunHour - hh) * 60);
  $('sunOut').textContent = `${String(hh % 24).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  $('sunNote').innerHTML = alt > 0
    ? `태양 고도 <b>${alt.toFixed(0)}°</b> · 방위 <b>${az.toFixed(0)}°</b> (${COMPASS[Math.round(az / 45) % 8]})`
    : `해가 진 뒤 · 고도 <b>${alt.toFixed(0)}°</b>`;
}

$('sunOn').addEventListener('change', applySun);
$('sunHour').addEventListener('input', e => { sunHour = parseFloat(e.target.value); applySun(); });
map.on('moveend', applySun);
// isStyleLoaded() 는 '모든 소스가 로드됨'까지 요구한다. 위성 타일을 계속 받아오는
// 실제 배포 환경에서는 영영 true 가 되지 않아 태양이 적용되지 않았다.
// style.load 는 스타일 자체가 파싱된 시점에 발화하므로 이쪽이 맞다.
map.on('style.load', () => { styleReady = true; applySun(); updateOcclusion(); });
// 만약을 위한 보강 — 위 이벤트를 놓쳐도 첫 유휴 시점에 한 번 붙인다.
map.on('idle', () => { if (!styleReady) { styleReady = true; applySun(); updateOcclusion(); } });

// ---------- 방위 기준 ----------
// MapLibre 의 bearing 은 '화면 위쪽에 오는 나침반 방위'다 (0=북, 90=동, 180=남).
// 중심과 축척은 그대로 두고 위쪽만 바꾼다. 같은 땅이 기준에 따라 어떻게 달라 보이는지가 핵심이다.
// pitch 를 0 으로 눕혀야 네 기준을 같은 조건에서 비교할 수 있다.
const ASPECTS = {
  N: { bearing: 0, note:
    '<b>현대 관습.</b> 프톨레마이오스 이래 굳어진 약속일 뿐, 자연이 정한 방향이 아니다.' },
  E: { bearing: 90, note:
    '<b>구약의 기준.</b> 해 뜨는 쪽을 향해 서서 방위를 부른다 — ' +
    '<bdi>קֶדֶם</bdi>(qedem) 앞=동 · <bdi>אָחוֹר</bdi>(aḥor) 뒤=서 · ' +
    '<bdi>יָמִין</bdi>(yamin) 오른쪽=남 · <bdi>שְׂמֹאל</bdi>(semol) 왼쪽=북.' },
  TILT: { bearing: 23.44, note:
    '<b>우주에는 위아래가 없다.</b> 지구 자전축은 공전면 수직에서 23.44° 기울어 있다. ' +
    'NASA 가 배포하는 사진이 늘 북쪽 위인 것은 관습이지 관측 사실이 아니다. 구형 뷰에서 가장 잘 보인다.' },
  S: { bearing: 180, note:
    '<b>아폴로 17호 블루마블 원본은 남쪽이 위였다.</b> 승무원이 그렇게 찍었고, ' +
    'NASA 가 배포하면서 180° 돌린 것이다.' }
};
const aspButtons = [...document.querySelectorAll('.btns button[data-aspect]')];

function syncAspectButtons() {
  const b = ((map.getBearing() % 360) + 360) % 360;
  for (const btn of aspButtons) {
    const t = ASPECTS[btn.dataset.aspect].bearing;
    const d = Math.abs(b - t);
    btn.setAttribute('aria-pressed', Math.min(d, 360 - d) < 0.5 ? 'true' : 'false');
  }
}
for (const btn of aspButtons) {
  btn.addEventListener('click', () => {
    const a = ASPECTS[btn.dataset.aspect];
    map.easeTo({ bearing: a.bearing, pitch: 0, duration: 1200 });
    $('aspNote').innerHTML = a.note;
  });
}
$('aspNote').innerHTML = '버튼을 눌러 ‘위쪽’을 바꿔 본다. 중심과 축척은 그대로 두므로, 같은 땅이 기준에 따라 어떻게 달라 보이는지 바로 비교된다.';
map.on('rotate', syncAspectButtons);
syncAspectButtons();

const fly = (c, z, b = -8, p = 58) => map.flyTo({ center: c, zoom: z, bearing: b, pitch: p, duration: 1800 });
$('viewLevant').onclick   = () => fly([35.6, 32.4], 7.2);     // 갈릴리~사해, 헤르몬
$('viewAnatolia').onclick = () => fly([31.5, 38.0], 6.0);     // 소아시아 (바울 1·2차)
$('viewAll').onclick      = () => fly([36.5, 33.5], 4.6, -8, 50);
$('viewGlobe').onclick    = () => fly([36.5, 30.0], 1.6, 0, 0);       // 구형 전체 보기

// ---------- 고도 읽기 (실제 DEM 값 확인용) ----------
function showElevation(e) {
  const z = typeof map.queryTerrainElevation === 'function' ? map.queryTerrainElevation(e.lngLat, { exaggerated: false }) : null;
  const el = z == null ? '—' : fmt(Math.round(z)) + ' m';
  $('readout').innerHTML =
    `고도 <b>${el}</b> &nbsp;·&nbsp; ${e.lngLat.lng.toFixed(3)}, ${e.lngLat.lat.toFixed(3)}`;
}
map.on('mousemove', showElevation);
map.on('click', showElevation);          // 터치에는 hover 가 없다
if (TOUCH) $('readout').textContent = '지도를 탭하면 고도를 표시합니다';

// ---------- 오류 표시 ----------
let errHide = null;
map.on('error', ev => {
  // tiles/ 는 bake 산출물이라 없는 것이 정상이다. 그 404 응답(HTML)을 이미지로
  // 디코드하려다 나는 실패까지 사용자에게 알릴 이유가 없다.
  if (ev && ev.sourceId === 'baked') return;

  const e = (ev && ev.error) || {};
  const s = $('status');
  s.style.display = 'block';
  s.dataset.source = (ev && ev.sourceId) || '';
  const WHO = { terrain: '지형', land: '지형', bathy: '해저 지형', vector: '물·국경',
                world: '전지구 자연색' };
  const who = WHO[ev && ev.sourceId] || '타일';
  s.textContent = who + ' 로드 오류: ' + (e.message || '네트워크 확인');
  // 타일 단위 오류(sourceId 가 붙는다)는 외부 서비스가 이따금 한 번씩 실패하는
  // 것이므로 스스로 사라지게 둔다. sourceId 가 없는 스타일·표현식 오류는 고쳐야
  // 하는 문제이므로 남겨 둔다.
  clearTimeout(errHide);
  if (ev && ev.sourceId) errHide = setTimeout(() => { s.style.display = 'none'; }, 6000);
});

// 저작권 표기는 compact 로 두되 접힌 상태에서 시작한다.
// 좁은 화면에서 펼쳐진 채로 뜨면 6줄을 차지해 화면의 4분의 1을 먹고 패널까지 가린다.
// MapLibre 는 소스 표기가 갱신될 때마다(styledata) 다시 펼치므로 그때마다 접어야 하고,
// details 요소라 클래스와 open 속성을 함께 걷어야 한다.
// 사용자가 직접 펼친 경우는 그대로 둔다 — 출처는 언제든 볼 수 있어야 한다.
let attribOpenedByUser = false;
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('.maplibregl-ctrl-attrib')) attribOpenedByUser = true;
}, true);
const NARROW = () => matchMedia('(max-width: 760px), (max-height: 500px)').matches;
function collapseAttrib() {
  if (attribOpenedByUser || !NARROW()) return;
  const a = document.querySelector('.maplibregl-ctrl-attrib.maplibregl-compact');
  if (!a) return;
  a.classList.remove('maplibregl-compact-show');
  a.removeAttribute('open');
}
map.on('load', collapseAttrib);
map.on('styledata', collapseAttrib);
} // initMap
</script>
</body>
</html>
